services:
  ros2_workspace:
    build:
      context: .
      dockerfile: Dockerfile
      # Build natively for host architecture (auto-detected)
    image: hawkeye-ros:latest
    container_name: hawkeye-ros
    stdin_open: true
    tty: true
    privileged: true  
    volumes:
      - /dev:/dev     
      - ./src:/ros2_ws/src
      - ./test_images:/ros2_ws/test_images
    working_dir: /ros2_ws
    command: bash -lc "sudo chown -R ros:ros /ros2_ws/build /ros2_ws/install && colcon build --packages-skip imaging && source install/setup.bash && tail -f /dev/null"
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0

      # Orchestrator configuration
      # This is only for LOCAL DEVELOPMENT where the signaling server is running on the host machine - in prod this should be set to the actual remote signaling
      # https://kai-subclavian-constrictedly.ngrok-free.dev server URL
      - WEBRTC_SIGNALING_URL=https://kai-subclavian-constrictedly.ngrok-free.dev

      # Topics
      - OBJECT_DETECTION_TOPIC=color/image_raw/compressed
      - IMAGE_REQUEST_TOPIC=image_request
      - YOLO_AUTOINSTALL=False
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - PYTHONPATH=/home/ros/.local/lib/python3.10/site-packages:${PYTHONPATH}
    ipc: host
volumes:
  ros2_ws_build:
  ros2_ws_install:
